name: CPU contracts
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            extra: ""
          - os: windows-latest
            extra: "--extra tracking"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.11 ${{ matrix.extra }}
      - run: uv run --locked ${{ matrix.extra }} python -m unittest discover -s tests -v
