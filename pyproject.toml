[project]
name = "ralphdev-unsloth-autoresearch"
version = "0.1.0"
description = "한국어 KLUE-MRC로 배우는 Unsloth agent autoresearch"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "datasets==4.3.0",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pyarrow==21.0.0",
]

[project.optional-dependencies]
gpu = [
  "torch==2.11.0+cu130",
  "torchvision==0.26.0+cu130",
  "transformers==5.3.0",
  "trl==0.23.1",
  "peft==0.18.1",
  "accelerate==1.15.0",
  "bitsandbytes==0.50.2",
  "triton-windows==3.6.0.post26 ; sys_platform == 'win32'",
  "xformers==0.0.35",
  "unsloth==2026.9.4",
  "unsloth_zoo==2026.9.3",
  "torchao==0.17.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
