[project]
name = "klue-mrc-autoresearch"
version = "0.1.0"
description = "Autoresearch loop for KLUE-MRC QLoRA fine-tuning of Qwen3.5-4B"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "torch>=2.9",
    "torchvision",
    "pillow",
    "unsloth>=2026.9.7",
    "unsloth_zoo>=2026.9.6",
    "transformers>=5",
    "trl",
    "peft",
    "bitsandbytes>=0.50",
    "datasets",
    "huggingface_hub",
    "wandb",
    "numpy",
    "requests",
    "triton-windows; sys_platform == 'win32'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
